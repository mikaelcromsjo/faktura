<div x-init="$store.modal.title = '{{ 'User' | t }}: {{ user.username }}'"></div>
<div x-init="$store.modal.submit = '{{ 'Save' | t }}'"></div>

<form
    hx-post="{{ url_for('upsert_user_admin') }}"
    hx-target="#users-list"
    hx-swap="innerHTML"
    hx-ext="json-enc"
    hx-headers='{"Content-Type": "application/json"}'
    x-init="
        $el.addEventListener('htmx:afterRequest', (event) => {
            if (event.detail.xhr.status === 200) {
                $store.modal.open = false;
            } else if (event.detail.xhr.status >= 400) {
                showPopup(event);
            }
        })
    "
>
    {% if user.id %}
    <div class="mb-2 hidden">
        <label class="block font-semibold">{{ "ID" | t }}</label>
        <input type="text" name="id" value="{{ user.id }}" class="border p-1 w-full"/>
    </div>
    {% endif %}

    <h2 class="text-xl font-semibold mb-2">{{ "Account" | t }}</h2>

    <!-- Username -->
    <div class="mb-2">
        <label class="block font-semibold">{{ "Username" | t }}:*</label>
        <input required type="text" name="username" value="{{ user.username or '' }}" class="border p-1 w-full"/>
    </div>

    <!-- Admin -->
    <div class="mb-2">
        <label class="block font-semibold">{{ "Admin" | t }}</label>
        <select name="admin" class="border p-1 w-full">
            <option value="0" {% if not user.admin %}selected{% endif %}>{{ "No" | t }}</option>
            <option value="1" {% if user.admin %}selected{% endif %}>{{ "Yes" | t }}</option>
        </select>
    </div>

<!-- Password (required for new, optional for edit) -->
<div class="mb-2">
    <label class="block font-semibold">
        {{ "Password" | t }}{% if not user.id %}:*{% else %} {{ "(leave blank to keep current)" | t }}{% endif %}
    </label>
    <input 
        type="password" 
        name="password" 
        class="border p-1 w-full"
        {% if not user.id %}required{% endif %}
    />
</div>


    <!-- Caller -->
    <div class="mb-2">
        <label class="block font-semibold">{{ "Caller" | t }}</label>
        <select name="caller_id" class="border p-1 w-full">
            <option value="" {% if not user.caller %}selected{% endif %}>{{ "Select..." | t }}</option>
            {% for caller in callers %}
            <option value="{{ caller.id }}" {% if user.caller_id == caller.id %}selected{% endif %}>{{ caller.name }}</option>
            {% endfor %}
        </select>
    </div>

    <h2 class="text-xl font-semibold mb-2 mt-4">{{ "User Information" | t }}</h2>

    <!-- First Name -->
    <div class="mb-2">
        <label class="block font-semibold">{{ 'First Name' | t }}</label>
        <input type="text" name="extra.first_name" value="{{ user.extra.first_name or '' }}" class="border p-1 w-full"/>
    </div>

    <!-- Last Name -->
    <div class="mb-2">
        <label class="block font-semibold">{{ 'Last Name' | t }}</label>
        <input type="text" name="extra.last_name" value="{{ user.extra.last_name or '' }}" class="border p-1 w-full"/>
    </div>

    <!-- Address -->
    <div class="mb-2">
        <label class="block font-semibold">{{ 'Address' | t }}</label>
        <input type="text" name="extra.address" value="{{ user.extra.address or '' }}" class="border p-1 w-full"/>
    </div>

    <!-- Email -->
    <div class="mb-2">
        <label class="block font-semibold">{{ 'Email' | t }}</label>
        <input type="email" name="extra.email" value="{{ user.extra.email or '' }}" class="border p-1 w-full"/>
    </div>

    <!-- Phone -->
    <div class="mb-2">
        <label class="block font-semibold">{{ 'Phone' | t }}</label>
        <input type="text" name="extra.phone" value="{{ user.extra.phone or '' }}" class="border p-1 w-full"/>
    </div>

    <div class="flex justify-end mt-4">
        <button type="submit" class="px-3 py-1 bg-blue-500 text-white rounded">{{ "Save" | t }}</button>
    </div>
</form>
