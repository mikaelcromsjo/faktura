<div id="callers-container">
    <div id="callers-list">

        <div class="full-table">
            <table class="table-auto w-full border overflow-x-auto">
                <thead>
                    <tr>
                        <th class="px-2 py-1 border">{{ "Account" | t }}</th>
                        <th class="px-2 py-1 border">{{ "Bank Name" | t }}</th>
                        <th class="px-2 py-1 border">{{ "IBAN" | t }}</th>
                        <th x-show="is_admin" class="px-2 py-1 border">{{ "Comment" | t }}</th>
                        <th class="px-2 py-1 border">{{ "Command" | t }}</th>
                    </tr>
                </thead>
                <tbody>
                    {% for caller in callers %}
                    <tr hx-get="{{ url_for('caller_detail', caller_id=caller.id) }}?list=short"
                        hx-target="#callers-info"
                        hx-trigger="click"
                        class="cursor-pointer hover:bg-gray-100">

                        <td class="px-2 py-1 border">{{ caller.name }}</td>
                        <td class="px-2 py-1 border">{{ caller.extra.bank_name or '' }}</td>
                        <td class="px-2 py-1 border">{{ caller.extra.iban or '' }}</td>
                        <td x-show="is_admin" class="px-2 py-1 border">{{ caller.extra.comment or '' }}</td>

                        <td class="px-2 py-1 border text-center" 
                            @click.stop
                            >

                            <button 
                                hx-get="{{ url_for('caller_detail', caller_id=caller.id) }}"
                                hx-target="#modal-container"
                                hx-swap="innerHTML"
                                @click="$store.modal.open = true"
                            >
                                {{ "Edit" | t }}
                            </button>                
                            <button 
                                hx-post="{{ url_for('delete_caller', caller_id=caller.id) }}"
                                hx-on="htmx:afterRequest: 
                                    showPopup(event);
                                    htmx.ajax('GET', '{{ url_for('callers_list') }}', {target:'#callers-container'}); "
                                hx-trigger="confirmed"
                                x-confirm="{{'Are you sure you want to delete this record?' | t }}"
                            >
                                {{ "Delete" | t }}
                            </button>    
                        </td>

                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="mt-2 flex gap-2">
            <button hx-get="{{ url_for('caller_detail', caller_id=0) }}"
                    hx-target="#modal-container"
                    @click="$store.modal.open = true"
                    class="px-3 py-1 border rounded bg-gray-100 hover:bg-gray-200">
                {{ "New Account" | t }}
            </button>
        </div>
        
        <div class="mt-4" id="callers-info"></div>
        
    </div>
</div>
